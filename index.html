<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    /* ── Reset & Base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky:    #e8f4fd;
      --cloud:  #f5f9ff;
      --ink:    #1a2332;
      --muted:  #6b7f96;
      --border: #d0dcea;
      --accent: #3a7bd5;
      --accent2:#e8f0fb;
      --sunny:  #f59e0b;
      --rainy:  #3b82f6;
      --snowy:  #93c5fd;
      --cloudy: #94a3b8;
      --windy:  #10b981;
      --danger: #ef4444;
      --success:#22c55e;
      --radius: 10px;
      --shadow: 0 2px 12px rgba(26,35,50,0.08);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--sky);
      color: var(--ink);
      min-height: 100vh;
      padding: 0;
    }

    /* ── Header ───────────────────────────────────── */
    header {
      background: var(--ink);
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo { font-size: 24px; }
    header h1 {
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    header span {
      margin-left: auto;
      font-size: 12px;
      color: #7a8fa8;
      font-family: 'DM Mono', monospace;
    }

    /* ── Tab Bar ──────────────────────────────────── */
    .tabs {
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      padding: 0 32px;
      gap: 4px;
      overflow-x: auto;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 14px 18px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 500;
    }
    .tab-icon { font-size: 15px; }

    /* ── Main Content ─────────────────────────────── */
    main { padding: 28px 32px; max-width: 900px; }

    .panel { display: none; animation: fadeIn .18s ease; }
    .panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Cards ────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 16px; }
    .card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }

    /* ── Forms ────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    input, select {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--ink);
      background: var(--cloud);
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus { border-color: var(--accent); background: #fff; }
    input.error { border-color: var(--danger); }

    .hint {
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }
    .field-error {
      font-size: 11px;
      color: var(--danger);
      display: none;
    }
    .field-error.show { display: block; }

    /* ── Buttons ──────────────────────────────────── */
    .btn {
      padding: 10px 22px;
      border-radius: 6px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary { background: var(--accent2); color: var(--accent); }
    .btn-secondary:hover { opacity: 0.8; }
    .btn-row { margin-top: 18px; display: flex; gap: 10px; align-items: center; }

    /* ── Toast ────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--ink);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'DM Mono', monospace;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 999;
      max-width: 320px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.ok  { background: #14532d; }
    #toast.err { background: #7f1d1d; }

    /* ── Observation Table ────────────────────────── */
    .obs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .obs-table th {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .obs-table td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--sky);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--ink);
      vertical-align: middle;
    }
    .obs-table tr:last-child td { border-bottom: none; }
    .obs-table tr:hover td { background: var(--sky); }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
    }
    .badge-Sunny  { background: #fef3c7; color: #92400e; }
    .badge-Cloudy { background: #f1f5f9; color: #475569; }
    .badge-Rainy  { background: #eff6ff; color: #1e40af; }
    .badge-Snowy  { background: #e0f2fe; color: #0c4a6e; }
    .badge-Windy  { background: #ecfdf5; color: #065f46; }

    /* ── Stats Grid ───────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: var(--cloud);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .stat-value {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      color: var(--ink);
    }
    .stat-value.hot  { color: #b45309; }
    .stat-value.cold { color: #1d4ed8; }

    /* ── ASCII Chart ──────────────────────────────── */
    .chart-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }
    .chart-date { width: 90px; color: var(--muted); flex-shrink: 0; }
    .chart-bar-wrap { flex: 1; background: var(--sky); border-radius: 3px; overflow: hidden; height: 18px; }
    .chart-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      min-width: 2px;
      display: flex;
      align-items: center;
      padding-left: 6px;
      font-size: 10px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      transition: width .4s ease;
    }
    .chart-temp { width: 54px; text-align: right; color: var(--ink); flex-shrink: 0; }

    /* ── Empty State ──────────────────────────────── */
    .empty {
      text-align: center;
      padding: 36px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .empty-icon { font-size: 32px; display: block; margin-bottom: 8px; }

    /* ── Records ──────────────────────────────────── */
    .record-list { display: flex; flex-direction: column; gap: 10px; }
    .record-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--cloud);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .record-icon { font-size: 22px; }
    .record-label { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
    .record-val {
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
    }
    .record-date { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }

    /* ── Search ───────────────────────────────────── */
    .search-row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px; }
    .search-row .form-group { flex: 1; }

    /* ── Filter row ───────────────────────────────── */
    .filter-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: flex-end; }
    .filter-row .form-group { min-width: 140px; }

    /* ── YOY Table ────────────────────────────────── */
    .yoy-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .yoy-table th {
      font-size: 11px; color: var(--muted); text-align: left; padding: 8px 12px;
      border-bottom: 1px solid var(--border); font-family: 'DM Mono', monospace;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .yoy-table td {
      padding: 10px 12px; font-family: 'DM Mono', monospace;
      border-bottom: 1px solid var(--sky); font-size: 13px;
    }
    .yoy-table tr:last-child td { border-bottom: none; }

    /* ── Prediction box ───────────────────────────── */
    .prediction-box {
      background: linear-gradient(135deg, #e8f0fb, #f0f7ff);
      border: 1px solid #c5d8f5;
      border-radius: var(--radius);
      padding: 22px 24px;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .prediction-icon { font-size: 40px; }
    .prediction-body {}
    .prediction-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; margin-bottom: 4px; }
    .prediction-main { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: var(--ink); }
    .prediction-note { font-size: 11px; color: var(--muted); margin-top: 4px; }

    @media (max-width: 600px) {
      main { padding: 16px; }
      header { padding: 14px 16px; }
      .tabs { padding: 0 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">🌤</span>
  <h1>Weather Tracker</h1>
  <span id="header-count">— observations</span>
</header>

<!-- Tab Bar -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('record')">
    <span class="tab-icon">📝</span> Record
  </button>
  <button class="tab-btn" onclick="switchTab('all')">
    <span class="tab-icon">📋</span> All Observations
  </button>
  <button class="tab-btn" onclick="switchTab('stats')">
    <span class="tab-icon">📊</span> Statistics
  </button>
  <button class="tab-btn" onclick="switchTab('search')">
    <span class="tab-icon">🔍</span> Search
  </button>
  <button class="tab-btn" onclick="switchTab('trends')">
    <span class="tab-icon">📈</span> Trends
  </button>
  <button class="tab-btn" onclick="switchTab('records')">
    <span class="tab-icon">🏆</span> Records
  </button>
</div>

<main>

  <!-- ── TAB: Record ──────────────────────────────── -->
  <div id="panel-record" class="panel active">
    <div class="card">
      <div class="card-title">New Observation</div>
      <div class="form-grid">

        <div class="form-group">
          <label for="f-date">Date</label>
          <input type="date" id="f-date" />
          <span class="hint">stored as MM-DD-YYYY</span>
        </div>

        <div class="form-group">
          <label for="f-temp">Temperature (°C)</label>
          <input type="number" id="f-temp" placeholder="e.g. 23.5" step="0.1" />
          <span id="err-temp" class="field-error">Enter a valid number.</span>
        </div>

        <div class="form-group">
          <label for="f-condition">Condition</label>
          <select id="f-condition">
            <option value="">— select —</option>
            <option>Sunny</option>
            <option>Cloudy</option>
            <option>Rainy</option>
            <option>Snowy</option>
            <option>Windy</option>
          </select>
          <span id="err-cond" class="field-error">Please select a condition.</span>
        </div>

        <div class="form-group">
          <label for="f-humidity">Humidity (%)</label>
          <input type="number" id="f-humidity" placeholder="e.g. 65" min="0" max="100" />
          <span id="err-hum" class="field-error">Enter 0–100.</span>
        </div>

        <div class="form-group full">
          <label for="f-wind">Wind Speed (km/h)</label>
          <input type="number" id="f-wind" placeholder="e.g. 18.0" min="0" step="0.1" style="max-width:220px"/>
          <span id="err-wind" class="field-error">Enter a valid number ≥ 0.</span>
        </div>

      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="saveObservation()">Save Observation</button>
        <button class="btn btn-secondary" onclick="clearForm()">Clear</button>
      </div>
    </div>
  </div>

  <!-- ── TAB: All Observations ──────────────────── -->
  <div id="panel-all" class="panel">
    <div class="card">
      <div class="card-title" id="all-title">All Observations</div>
      <div id="all-body"></div>
    </div>
  </div>

  <!-- ── TAB: Statistics ────────────────────────── -->
  <div id="panel-stats" class="panel">
    <div id="stats-body"></div>
  </div>

  <!-- ── TAB: Search ────────────────────────────── -->
  <div id="panel-search" class="panel">
    <div class="card">
      <div class="card-title">Search by Date</div>
      <div class="search-row">
        <div class="form-group">
          <label for="s-date">Date</label>
          <input type="date" id="s-date" />
        </div>
        <button class="btn btn-primary" onclick="doSearch()">Search</button>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <!-- ── TAB: Trends ────────────────────────────── -->
  <div id="panel-trends" class="panel">
    <div class="card">
      <div class="card-title">Temperature Trend</div>
      <div class="filter-row">
        <div class="form-group">
          <label for="t-filter">Filter by Season</label>
          <select id="t-filter" onchange="renderTrends()">
            <option value="all">All time</option>
            <option value="Winter">Winter</option>
            <option value="Spring">Spring</option>
            <option value="Summer">Summer</option>
            <option value="Fall">Fall</option>
          </select>
        </div>
        <div class="form-group">
          <label for="t-month">Filter by Month</label>
          <select id="t-month" onchange="renderTrends()">
            <option value="0">All months</option>
            <option value="1">January</option><option value="2">February</option>
            <option value="3">March</option><option value="4">April</option>
            <option value="5">May</option><option value="6">June</option>
            <option value="7">July</option><option value="8">August</option>
            <option value="9">September</option><option value="10">October</option>
            <option value="11">November</option><option value="12">December</option>
          </select>
        </div>
      </div>
      <div id="trends-chart"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-title">Year-over-Year Comparison</div>
      <div id="yoy-body"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-title">Tomorrow's Prediction</div>
      <div id="predict-body"></div>
    </div>
  </div>

  <!-- ── TAB: Records ───────────────────────────── -->
  <div id="panel-records" class="panel">
    <div class="card">
      <div class="card-title">Record-Breaking Observations</div>
      <div id="records-body"></div>
    </div>
  </div>

</main>

<!-- Toast notification -->
<div id="toast"></div>

<script>
/* ── Storage key & data ─────────────────────────────── */
const STORE_KEY = 'weatherObs';

// Load from localStorage (mimics the CSV)
function loadObs() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { return []; }
}

function saveObs(obs) {
  localStorage.setItem(STORE_KEY, JSON.stringify(obs));
  updateHeaderCount();
}

/* ── Helpers ──────────────────────────────────────── */
function fmtDate(dateStr) {
  // Convert input[type=date] value (YYYY-MM-DD) to MM-DD-YYYY for storage
  const [y, m, d] = dateStr.split('-');
  return `${m}-${d}-${y}`;
}

function parseDate(mmddyyyy) {
  const [m, d, y] = mmddyyyy.split('-');
  return new Date(`${y}-${m}-${d}`);
}

const SEASONS = { 12:'Winter',1:'Winter',2:'Winter', 3:'Spring',4:'Spring',5:'Spring',
                  6:'Summer',7:'Summer',8:'Summer',  9:'Fall',10:'Fall',11:'Fall' };

function getSeason(mmddyyyy) {
  const month = parseInt(mmddyyyy.split('-')[0]);
  return SEASONS[month];
}

function mean(arr) { return arr.reduce((a,b)=>a+b,0)/arr.length; }

function mostCommon(arr) {
  const counts = {};
  arr.forEach(v => counts[v] = (counts[v]||0)+1);
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
}

function condIcon(c) {
  return {Sunny:'☀️',Cloudy:'☁️',Rainy:'🌧️',Snowy:'❄️',Windy:'💨'}[c] || '🌡️';
}

function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.className = '', 2800);
}

function updateHeaderCount() {
  const obs = loadObs();
  document.getElementById('header-count').textContent =
    `${obs.length} observation${obs.length !== 1 ? 's' : ''}`;
}

/* ── Tab switching ────────────────────────────────── */
function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`panel-${name}`).classList.add('active');
  event.currentTarget.classList.add('active');

  // Render on open
  if (name === 'all')     renderAll();
  if (name === 'stats')   renderStats();
  if (name === 'trends')  renderTrends();
  if (name === 'records') renderRecords();
}

/* ── Record tab ───────────────────────────────────── */
function clearForm() {
  ['f-date','f-temp','f-condition','f-humidity','f-wind'].forEach(id => {
    const el = document.getElementById(id);
    el.value = '';
    el.classList.remove('error');
  });
  document.querySelectorAll('.field-error').forEach(e => e.classList.remove('show'));
}

function saveObservation() {
  let valid = true;

  const dateVal  = document.getElementById('f-date').value;
  const tempVal  = document.getElementById('f-temp').value;
  const condVal  = document.getElementById('f-condition').value;
  const humVal   = document.getElementById('f-humidity').value;
  const windVal  = document.getElementById('f-wind').value;

  // Reset errors
  document.querySelectorAll('.field-error').forEach(e => e.classList.remove('show'));
  ['f-date','f-temp','f-condition','f-humidity','f-wind'].forEach(id =>
    document.getElementById(id).classList.remove('error'));

  if (!dateVal) {
    document.getElementById('f-date').classList.add('error');
    valid = false;
  }
  if (tempVal === '' || isNaN(parseFloat(tempVal))) {
    document.getElementById('err-temp').classList.add('show');
    document.getElementById('f-temp').classList.add('error');
    valid = false;
  }
  if (!condVal) {
    document.getElementById('err-cond').classList.add('show');
    document.getElementById('f-condition').classList.add('error');
    valid = false;
  }
  const hum = parseFloat(humVal);
  if (humVal === '' || isNaN(hum) || hum < 0 || hum > 100) {
    document.getElementById('err-hum').classList.add('show');
    document.getElementById('f-humidity').classList.add('error');
    valid = false;
  }
  const wind = parseFloat(windVal);
  if (windVal === '' || isNaN(wind) || wind < 0) {
    document.getElementById('err-wind').classList.add('show');
    document.getElementById('f-wind').classList.add('error');
    valid = false;
  }
  if (!valid) return;

  const obs = loadObs();
  obs.push({
    date:            fmtDate(dateVal),
    temperature_c:   parseFloat(parseFloat(tempVal).toFixed(1)),
    condition:       condVal,
    humidity_pct:    parseFloat(humVal),
    wind_speed_kmh:  parseFloat(windVal),
  });
  saveObs(obs);
  clearForm();
  showToast('✅ Observation saved!', 'ok');
}

/* ── All Observations tab ─────────────────────────── */
function renderAll(subset, label) {
  const obs = subset || loadObs();
  const title = label || `All Observations`;
  document.getElementById('all-title').textContent =
    `${title} — ${obs.length} record${obs.length !== 1 ? 's' : ''}`;

  if (!obs.length) {
    document.getElementById('all-body').innerHTML =
      `<div class="empty"><span class="empty-icon">🌫️</span>No observations yet. Add one in the Record tab.</div>`;
    return;
  }

  const rows = obs.map(o => `
    <tr>
      <td>${o.date}</td>
      <td>${o.temperature_c}°C</td>
      <td><span class="badge badge-${o.condition}">${condIcon(o.condition)} ${o.condition}</span></td>
      <td>${o.humidity_pct}%</td>
      <td>${o.wind_speed_kmh} km/h</td>
    </tr>`).join('');

  document.getElementById('all-body').innerHTML = `
    <table class="obs-table">
      <thead>
        <tr>
          <th>Date</th><th>Temp</th><th>Condition</th><th>Humidity</th><th>Wind</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

/* ── Statistics tab ───────────────────────────────── */
function renderStats() {
  const obs = loadObs();
  const el  = document.getElementById('stats-body');

  if (!obs.length) {
    el.innerHTML = `<div class="card"><div class="empty"><span class="empty-icon">📉</span>No data yet.</div></div>`;
    return;
  }

  const temps = obs.map(o => o.temperature_c);
  const avg   = mean(temps).toFixed(1);
  const minT  = Math.min(...temps);
  const maxT  = Math.max(...temps);
  const topC  = mostCommon(obs.map(o => o.condition));
  const avgH  = mean(obs.map(o => o.humidity_pct)).toFixed(1);
  const avgW  = mean(obs.map(o => o.wind_speed_kmh)).toFixed(1);

  el.innerHTML = `
    <div class="card">
      <div class="card-title">Summary</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Avg Temperature</div>
          <div class="stat-value">${avg}°C</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Hottest Day</div>
          <div class="stat-value hot">${maxT}°C</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Coldest Day</div>
          <div class="stat-value cold">${minT}°C</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Most Common</div>
          <div class="stat-value" style="font-size:17px">${condIcon(topC)} ${topC}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Avg Humidity</div>
          <div class="stat-value">${avgH}%</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Avg Wind</div>
          <div class="stat-value">${avgW} <span style="font-size:13px">km/h</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Condition Breakdown</div>
      ${renderCondBreakdown(obs)}
    </div>`;
}

function renderCondBreakdown(obs) {
  const counts = {};
  obs.forEach(o => counts[o.condition] = (counts[o.condition]||0)+1);
  const total = obs.length;
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([cond, n]) => {
    const pct = ((n/total)*100).toFixed(0);
    return `
      <div class="chart-row">
        <div class="chart-date">${condIcon(cond)} ${cond}</div>
        <div class="chart-bar-wrap">
          <div class="chart-bar" style="width:${pct}%;background:var(--accent)">${n}</div>
        </div>
        <div class="chart-temp">${pct}%</div>
      </div>`;
  }).join('');
}

/* ── Search tab ───────────────────────────────────── */
function doSearch() {
  const raw = document.getElementById('s-date').value;
  if (!raw) { showToast('Pick a date first.', 'err'); return; }

  const target = fmtDate(raw);
  const obs    = loadObs();
  const hits   = obs.filter(o => o.date === target);
  const el     = document.getElementById('search-results');

  if (!hits.length) {
    el.innerHTML = `<div class="empty"><span class="empty-icon">🔎</span>No observations found for ${target}.</div>`;
    return;
  }

  const rows = hits.map(o => `
    <tr>
      <td>${o.date}</td>
      <td>${o.temperature_c}°C</td>
      <td><span class="badge badge-${o.condition}">${condIcon(o.condition)} ${o.condition}</span></td>
      <td>${o.humidity_pct}%</td>
      <td>${o.wind_speed_kmh} km/h</td>
    </tr>`).join('');

  el.innerHTML = `
    <table class="obs-table">
      <thead><tr><th>Date</th><th>Temp</th><th>Condition</th><th>Humidity</th><th>Wind</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

/* ── Trends tab ───────────────────────────────────── */
function renderTrends() {
  let obs = loadObs();
  const season = document.getElementById('t-filter').value;
  const month  = parseInt(document.getElementById('t-month').value);

  // Reset whichever filter wasn't just changed
  if (season !== 'all') obs = obs.filter(o => getSeason(o.date) === season);
  if (month  !== 0)     obs = obs.filter(o => parseInt(o.date.split('-')[0]) === month);

  const el = document.getElementById('trends-chart');

  if (!obs.length) {
    el.innerHTML = `<div class="empty"><span class="empty-icon">📉</span>No data for this filter.</div>`;
  } else {
    const maxT = Math.max(...obs.map(o => o.temperature_c));
    el.innerHTML = obs.map(o => {
      const pct = maxT > 0 ? Math.max(4, (o.temperature_c / maxT) * 100) : 4;
      const col = o.temperature_c > 30 ? '#ef4444'
                : o.temperature_c > 20 ? '#f59e0b'
                : o.temperature_c > 10 ? '#3a7bd5'
                : '#93c5fd';
      return `
        <div class="chart-row">
          <div class="chart-date">${o.date}</div>
          <div class="chart-bar-wrap">
            <div class="chart-bar" style="width:${pct}%;background:${col}">${o.temperature_c > 10 ? o.temperature_c+'°' : ''}</div>
          </div>
          <div class="chart-temp">${o.temperature_c}°C</div>
        </div>`;
    }).join('');
  }

  renderYOY();
  renderPrediction();
}

function renderYOY() {
  const obs = loadObs();
  const el  = document.getElementById('yoy-body');
  if (!obs.length) { el.innerHTML = `<div class="empty">No data.</div>`; return; }

  const byYear = {};
  obs.forEach(o => {
    const y = o.date.split('-')[2];
    (byYear[y] = byYear[y]||[]).push(o);
  });

  const years = Object.keys(byYear).sort();
  if (years.length < 2) {
    el.innerHTML = `<div class="empty" style="padding:16px">Need at least 2 years of data for a comparison.</div>`;
    return;
  }

  const rows = years.map(y => {
    const temps = byYear[y].map(o => o.temperature_c);
    const avg   = mean(temps).toFixed(1);
    const top   = mostCommon(byYear[y].map(o => o.condition));
    return `<tr><td>${y}</td><td>${avg}°C</td><td>${condIcon(top)} ${top}</td><td>${byYear[y].length}</td></tr>`;
  }).join('');

  el.innerHTML = `
    <table class="yoy-table">
      <thead><tr><th>Year</th><th>Avg Temp</th><th>Top Condition</th><th>Records</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderPrediction() {
  const obs   = loadObs();
  const el    = document.getElementById('predict-body');
  const month = new Date().getMonth() + 1;
  const same  = obs.filter(o => parseInt(o.date.split('-')[0]) === month);

  if (!same.length) {
    el.innerHTML = `<div class="empty" style="padding:16px">No historical data for this month yet.</div>`;
    return;
  }

  const avgT  = mean(same.map(o => o.temperature_c)).toFixed(1);
  const topC  = mostCommon(same.map(o => o.condition));
  const mName = new Date().toLocaleString('default', { month:'long' });

  el.innerHTML = `
    <div class="prediction-box">
      <div class="prediction-icon">${condIcon(topC)}</div>
      <div class="prediction-body">
        <div class="prediction-label">Based on ${same.length} ${mName} observation${same.length!==1?'s':''}</div>
        <div class="prediction-main">${topC} · ~${avgT}°C</div>
        <div class="prediction-note">Statistical estimate only — not a real forecast.</div>
      </div>
    </div>`;
}

/* ── Records tab ──────────────────────────────────── */
function renderRecords() {
  const obs = loadObs();
  const el  = document.getElementById('records-body');

  if (!obs.length) {
    el.innerHTML = `<div class="empty"><span class="empty-icon">🏆</span>No data yet.</div>`;
    return;
  }

  const hottest  = obs.reduce((a,b) => a.temperature_c  > b.temperature_c  ? a : b);
  const coldest  = obs.reduce((a,b) => a.temperature_c  < b.temperature_c  ? a : b);
  const windiest = obs.reduce((a,b) => a.wind_speed_kmh  > b.wind_speed_kmh  ? a : b);
  const humid    = obs.reduce((a,b) => a.humidity_pct    > b.humidity_pct    ? a : b);

  const items = [
    { icon:'🔥', label:'Hottest',    val:`${hottest.temperature_c}°C`,   date: hottest.date },
    { icon:'🥶', label:'Coldest',    val:`${coldest.temperature_c}°C`,   date: coldest.date },
    { icon:'💨', label:'Windiest',   val:`${windiest.wind_speed_kmh} km/h`, date: windiest.date },
    { icon:'💧', label:'Most Humid', val:`${humid.humidity_pct}%`,       date: humid.date },
  ];

  el.innerHTML = `<div class="record-list">` +
    items.map(r => `
      <div class="record-item">
        <div class="record-icon">${r.icon}</div>
        <div>
          <div class="record-label">${r.label}</div>
          <div class="record-val">${r.val}</div>
        </div>
        <div class="record-date">${r.date}</div>
      </div>`).join('') +
  `</div>`;
}

/* ── Init ─────────────────────────────────────────── */
// Set today's date as default in the Record form
document.getElementById('f-date').valueAsDate = new Date();
updateHeaderCount();
</script>
